<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<base href="./">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, Segoe UI, sans-serif; }
  #c { width: 100%; height: 100%; display: block; background: linear-gradient(#5a8fd0, #bcd2ea); outline: none; }
  #hud { position: fixed; left: 12px; top: 10px; color: #fff; font-size: 14px; line-height: 1.5; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: pre; }
  #prompt { position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); color: #fff; font-size: 22px;
            background: rgba(0,0,0,.65); border: 1px solid #ffdc6e; padding: 8px 18px; display: none; pointer-events: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 18px; text-align: center; white-space: pre-wrap; padding: 24px; pointer-events: none; }
  #bar { position: fixed; left: 20%; right: 20%; top: 56%; height: 6px; background: #333; border-radius: 3px; }
  #bar i { display: block; height: 100%; width: 0; background: #ffdc6e; border-radius: 3px; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hud"></div>
<div id="prompt"></div>
<div id="msg">Loading engine ...</div>
<div id="bar"><i></i></div>
<script src="sharp.js"></script>
<script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
